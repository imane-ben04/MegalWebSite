<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet"> 
    <title>MEGAL - Menuiserie Tout Genre d'Aluminium</title>
    <style>
        :root {
            --primary: #2A37F4;
            --black: #000000;
            --white: #FFFFFF;
            --page-width: 1728px;
            --content-width: 1580px;
            --font-main: Inter, Nunito, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            background: var(--white);
            color: var(--black);
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.35;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .site-header {
            position: relative;
            z-index: 20;
            background: var(--white);
        }

        .header-inner {
            width: min(100%, var(--page-width));
            height: 172px;
            margin: 0 auto;
            padding: 24px 68px 0;
            display: grid;
            grid-template-columns: 230px 1fr 230px;
            align-items: start;
        }

        .logo-link {
            width: 176px;
            display: inline-flex;
        }

        .logo-link img {
            width: 176px;
            height: auto;
        }

       .main-nav {
    justify-self: center;
    margin-top: 25px;
    /* Suppression du min-width fixe qui forçait un espace vide */
    display: inline-flex; /* Permet à la barre de s'adapter exactement à son contenu */
    align-items: center;
    border: 3px solid var(--primary);
    border-radius: 999px;
    background: var(--white);
    box-shadow: 0 2px 13px rgba(42, 55, 244, 0.3); /* Optionnel: adoucissement de l'ombre */
    overflow: hidden;
    padding: 3px; /* Ajoute un léger espace interne uniforme pour un effet "capsule" propre */
}

.main-nav a {
    height: 52px;
    padding: 0 32px; /* Augmentation légère pour une meilleure répartition */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--black);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    border-radius: 999px; /* Appliqué à tous les liens pour que les hovers/actifs soient arrondis */
    transition: background 0.2s ease, color 0.2s ease;
}

.main-nav a[aria-current="page"] {
    color: var(--white);
    background: var(--primary);
    view-transition-name: active-nav;
}

@view-transition {
    navigation: auto;
}

::view-transition-group(active-nav) {
    animation-duration: 260ms;
    animation-timing-function: ease;
}

        .header-actions {
            justify-self: end;
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle,
        .menu-toggle {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--primary);
            border-radius: 50%;
            background: var(--white);
            box-shadow: 0 2px 13px var(--primary);
        }

        .theme-toggle img {
            width: 34px;
            height: 34px;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .menu-toggle span {
            width: 23px;
            height: 3px;
            border-radius: 999px;
            background: var(--primary);
        }

  

        .site-footer {
            background: var(--primary);
            color: var(--white);
        }

        .footer-inner {
            width: min(var(--page-width), 100%);
            min-height: 300px;
            margin: 0 auto;
            padding: 0 92px 43px;
            display: grid;
            grid-template-columns: 401px 1fr 1fr;
            align-items: center;
            gap: 149px;
        }

        .footer-logo img {
            width: 401px;
            height: 385px;
            object-fit: cover;
        }

        .footer-column {
            align-self: start;
            margin-top: 126px;
        }

        .footer-column h4 {
            font-size: 1.33rem;
            line-height: 1.1;
            font-weight: 900;
        }

        .footer-column ul {
            margin-top: 17px;
            list-style: none;
        }

        .footer-column li,
        .footer-column a {
            color: var(--white);
            font-size: 1.33rem;
            line-height: 1.42;
            font-weight: 600;
        }

        .social-links {
            margin-top: 35px;
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .social-links img {
            width: 66px;
            height: 66px;
        }

        .copyright {
            width: min(var(--page-width), 100%);
            margin: 0 auto;
            padding: 0 24px 53px;
            color: var(--white);
            text-align: center;
            font-size: 1.28rem;
            font-weight: 700;
        }




@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0);
    }

}

        @media (max-width: 1180px) {
            .header-inner {
                height: 132px;
                padding: 20px 34px 0;
                grid-template-columns: 170px 1fr 120px;
            }

            .logo-link,
            .logo-link img {
                width: 145px;
            }

            .main-nav {
                min-width: 520px;
            }

            .main-nav a {
                min-width: auto;
                padding: 0 18px;
            }

            .hero {
                height: 520px;
            }

            .hero-content {
                padding-left: 42px;
                padding-top: 170px;
            }

            .stats-row,
            .services-grid,
            .atelier-inner,
            .footer-inner {
                width: 100%;
            }

            .stats-row {
                gap: 32px;
            }

            .stat-card {
                width: 50%;
            }

            .services-section,
            .partners-section,
            .atelier-section {
                padding-left: 34px;
                padding-right: 34px;
            }

            .services-grid {
                grid-template-columns: repeat(2, minmax(0, 480px));
                justify-content: center;
            }

            .partner-logos {
                gap: 80px;
            }

            .atelier-inner {
                grid-template-columns: minmax(360px, 520px) 1fr;
                gap: 34px;
            }

            .atelier-photo {
                width: 100%;
                height: auto;
            }

            .footer-inner {
                padding: 0 48px 43px;
                grid-template-columns: 300px 1fr 1.25fr;
                gap: 60px;
            }

            .footer-logo img {
                width: 300px;
                height: auto;
            }
        }

        @media (max-width: 820px) {
            body.nav-open {
                overflow: hidden;
            }

            .header-inner {
                height: 92px;
                padding: 16px 20px 0;
                grid-template-columns: 1fr auto;
                align-items: start;
            }

            .logo-link,
            .logo-link img {
                width: 128px;
            }

            .header-actions {
                grid-column: 2;
                margin-top: 0;
            }

            .theme-toggle,
            .menu-toggle {
                width: 46px;
                height: 46px;
            }

            .theme-toggle img {
                width: 28px;
                height: 28px;
            }

            .menu-toggle {
                display: inline-flex;
            }

            .main-nav {
                position: fixed;
                inset: 86px 18px auto;
                min-width: 0;
                min-height: auto;
                padding: 12px;
                display: grid;
                transform: translateY(-18px);
                opacity: 0;
                pointer-events: none;
                transition: transform 180ms ease, opacity 180ms ease;
            }

            body.nav-open .main-nav {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            .main-nav a {
                width: 100%;
                height: 46px;
            }

            .hero {
                height: 440px;
                background-position: 58% center;
            }

            .hero::before {
                width: 66%;
            }

            .hero-content {
                padding: 145px 22px 0;
            }

            .intro-section {
                padding: 32px 20px 68px;
            }

            .stats-row {
                margin-top: 42px;
                flex-direction: column;
                align-items: center;
                gap: 22px;
            }

            .stat-card {
                width: min(460px, 100%);
                min-height: 82px;
                padding: 12px 20px;
            }

            .stat-card img {
                width: 42px;
                height: 42px;
            }

            .services-section,
            .partners-section,
            .atelier-section {
                padding-left: 20px;
                padding-right: 20px;
            }

            .services-grid {
                margin-top: 44px;
                grid-template-columns: minmax(0, 480px);
                row-gap: 24px;
            }

            .service-card {
                min-height: auto;
            }

            .button-row {
                margin-top: 42px;
            }

            .primary-button {
    min-width: 457px;
    min-height: 73px;
    padding: 18px 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--primary);
    color: var(--white);
    font-size: clamp(1.05rem, 1.45vw, 1.45rem);
    
    /* Changez 900 par une valeur plus légère, ex: 500 (Medium) ou 600 (Semi-Bold) */
    font-weight: 450; 
    
    text-align: center;
    box-shadow: none;
}

            .partners-section {
                padding-top: 12px;
                padding-bottom: 86px;
            }

            .partner-logos {
                margin-top: 56px;
                grid-template-columns: 1fr;
                gap: 34px;
                min-height: 0;
            }

            .partner-logos img:nth-child(1),
            .partner-logos img:nth-child(2) {
                width: 220px;
            }

            .atelier-section {
                padding-bottom: 88px;
            }

            .atelier-inner {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }

            .atelier-photo {
                width: min(420px, 100%);
                margin: 0 auto;
            }

            .atelier-content {
                padding-top: 0;
            }

            .address-row {
                margin-top: 26px;
                justify-content: center;
                gap: 14px;
            }

            .address-row img {
                width: 46px;
                height: 46px;
            }

            .atelier-content .primary-button,
            .question-section .primary-button {
                min-width: 0;
                width: min(330px, 100%);
                min-height: 58px;
                margin-top: 30px;
            }

            .question-section {
                padding-bottom: 76px;
            }

            .footer-inner {
                min-height: 300;
                padding: 44px 24px 38px;
                grid-template-columns: 1fr;
                gap: 34px;
                text-align: center;
            }

            .footer-logo img {
                width: 220px;
                margin: 0 auto;
            }

            .footer-column {
                align-self: auto;
                margin-top: 0;
            }

            .social-links {
                justify-content: center;
                margin-top: 22px;
                gap: 28px;
            }

            .copyright {
                padding-bottom: 34px;
            }
        }

        @media (max-width: 480px) {
            .header-inner {
                padding-inline: 14px;
            }

            .hero {
                height: 360px;
            }

            .hero::before {
                width: 78%;
            }

            .hero-content {
                padding-top: 118px;
                padding-left: 18px;
            }

            .hero h1 {
                font-size: 3rem;
            }

            .hero p {
                font-size: 1.35rem;
            }

            .section-heading {
                width: 100%;
            }

            .service-card figure {
                height: auto;
                aspect-ratio: 480 / 352;
            }

            .stat-card span {
                white-space: normal;
            }
        }
    </style>
</head>
<body>

        <div class="header-inner">
            <a class="logo-link" href="acceuil.html" aria-label="Accueil MEGAL">
                <img src="../photo/logonew.png" width="341" height="138" alt="MEGAL">

    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const nav = document.querySelector("#main-nav");

        menuToggle.addEventListener("click", () => {
            const isOpen = document.body.classList.toggle("nav-open");
            menuToggle.setAttribute("aria-expanded", String(isOpen));
        });

        nav.addEventListener("click", (event) => {
            if (event.target.matches("a")) {
                document.body.classList.remove("nav-open");
                menuToggle.setAttribute("aria-expanded", "false");
            }
        });






    </script>

    
</body>
</html>
