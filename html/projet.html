    <title>MEGAL - Menuiserie Tout Genre d'Aluminium</title>
    <style>
        :root {
            --primary: #2A37F4;
            --black: #000000;
            --white: #FFFFFF;
            --page-width: 1728px;
            --content-width: 1580px;
            --font-main: Inter, Nunito, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            background: var(--white);
            color: var(--black);
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.35;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .site-header {
            position: relative;
            z-index: 20;
            background: var(--white);
        }

        .header-inner {
            width: min(100%, var(--page-width));
            height: 172px;
            margin: 0 auto;
            padding: 24px 68px 0;
            display: grid;
            grid-template-columns: 230px 1fr 230px;
            align-items: start;
        }

        .logo-link {
            width: 176px;
            display: inline-flex;
        }

        .logo-link img {
            width: 176px;
            height: auto;
        }

       .main-nav {
    justify-self: center;
    margin-top: 25px;
    /* Suppression du min-width fixe qui forçait un espace vide */
    display: inline-flex; /* Permet à la barre de s'adapter exactement à son contenu */
    align-items: center;
    border: 3px solid var(--primary);
    border-radius: 999px;
    background: var(--white);
    box-shadow: 0 2px 13px rgba(42, 55, 244, 0.3); /* Optionnel: adoucissement de l'ombre */
    overflow: hidden;
    padding: 3px; /* Ajoute un léger espace interne uniforme pour un effet "capsule" propre */
}

.main-nav a {
    height: 52px;
    padding: 0 32px; /* Augmentation légère pour une meilleure répartition */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--black);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    border-radius: 999px; /* Appliqué à tous les liens pour que les hovers/actifs soient arrondis */
    transition: background 0.2s ease, color 0.2s ease;
}

.main-nav a[aria-current="page"] {
    color: var(--white);
    background: var(--primary);
    view-transition-name: active-nav;
}

@view-transition {
    navigation: auto;
}

::view-transition-group(active-nav) {
    animation-duration: 260ms;
    animation-timing-function: ease;
}

        .header-actions {
            justify-self: end;
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle,
        .menu-toggle {
            width: 54px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--primary);
            border-radius: 50%;
            background: var(--white);
            box-shadow: 0 2px 13px var(--primary);
        }

        .theme-toggle img {
            width: 34px;
            height: 34px;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
        }

        .menu-toggle span {
            width: 23px;
            height: 3px;
            border-radius: 999px;
            background: var(--primary);
        }

  .hero{
    position: relative;
    overflow: hidden;
    height:630px;
    background-image:url("../photo/Rectangle 6.png");
    background-size:cover;
    background-position:center;
}


.hero::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:37%;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);

    z-index:2;          /* IMPORTANT */
    pointer-events:none;
}

.hero::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:120px;

    background:linear-gradient(
        to bottom,
        rgba(255,255,255,1) 0%,
        rgba(255,255,255,.85) 20%,
        rgba(255,255,255,.45) 55%,
        rgba(255,255,255,0) 100%
    );

    z-index:2;
    pointer-events:none;
}


        .hero-content {

            height: 100%;
            margin: 0 auto;
            padding-left: 69px;
            padding-top: 216px;
            position: relative;
            z-index: 3;
        }

        .hero h1 {
            color: var(--primary);
            font-size: clamp(3.6rem, 4.25vw, 4.65rem);
            line-height: 0.95;
            font-weight: 900;

        .hero p {

            line-height: 1.28;
            font-weight: 500;
            text-transform: uppercase;
        }

        .intro-section {

        .intro-copy p,

        }

        .intro-copy span {
            color: var(--primary);

        }

        .stats-row {

        .stat-card img {

        .atelier-content h2 {

        }

        .address-row {

        .question-section .primary-button {

        .site-footer {

            color: var(--white);
        }

        .footer-inner {

            padding: 0 92px 43px;

            grid-template-columns: 401px 1fr 1fr;

        .footer-logo img {
            width: 401px;

        .social-links {

        .social-links img {

        .copyright {

#assistant{
    position: fixed;
    bottom: -350px;
    right: 25px;
    z-index: 9999;

    display: flex;
    flex-direction: row-reverse; /* personnage à droite */
    align-items: flex-start;
    gap: 15px;

    transition: bottom .7s ease;
}

#assistant.show{
    bottom:20px;
}

#assistant img{
    width:170px;

    filter:
        drop-shadow(0 10px 30px rgba(0,0,0,.25));

    transition:.3s;
}

#assistant:hover img{
    transform:translateY(-5px);
}

.speech-bubble{
    position: relative;
    margin-top: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 16px 28px;
    min-height: 58px;

    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;

    background: rgba(22,28,45,.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.22);

    transition: .3s ease;
}

.speech-bubble::after{
    content:"";
    position:absolute;

    right:-8px;
    top:50%;
    transform:translateY(-50%) rotate(45deg);

    width:18px;
    height:18px;

    background: rgba(22,28,45,.92);

    border-top:1px solid rgba(255,255,255,.12);
    border-right:1px solid rgba(255,255,255,.12);
}

.speech-bubble:hover{
    transform: translateY(-4px) scale(1.03);
    box-shadow:
        0 18px 45px rgba(42,55,244,.45),
        inset 0 1px 0 rgba(255,255,255,.35);
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0);
    }

}

    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const nav = document.querySelector("#main-nav");

        menuToggle.addEventListener("click", () => {
            const isOpen = document.body.classList.toggle("nav-open");
            menuToggle.setAttribute("aria-expanded", String(isOpen));
        });

        nav.addEventListener("click", (event) => {
            if (event.target.matches("a")) {
                document.body.classList.remove("nav-open");
                menuToggle.setAttribute("aria-expanded", "false");
            }
        });


const hero = document.querySelector(".hero");

const images = [
    "../photo/Rectangle 6.png",
    "../photo/Rectangle 23.png",
    "../photo/Rectangle 24.png"
];

let current = 0;

// Couche 1
const bg1 = document.createElement("div");

// Couche 2
const bg2 = document.createElement("div");

[bg1, bg2].forEach(bg => {
    bg.style.position = "absolute";
    bg.style.inset = "0";
    bg.style.backgroundSize = "cover";
    bg.style.backgroundPosition = "center";
    bg.style.zIndex = "0";
});

bg1.style.backgroundImage = `url('${images[0]}')`;
bg2.style.transform = "translateX(100%)";

hero.appendChild(bg1);
hero.appendChild(bg2);

let active = bg1;
let next = bg2;

setInterval(() => {

    current = (current + 1) % images.length;

    next.style.backgroundImage = `url('${images[current]}')`;

    next.style.transition = "none";
    active.style.transition = "none";

    next.style.transform = "translateX(100%)";
    active.style.transform = "translateX(0)";

    requestAnimationFrame(() => {

        next.style.transition = "transform .4s ease";
        active.style.transition = "transform .4s ease";

        next.style.transform = "translateX(0)";
        active.style.transform = "translateX(-100%)";
    });

    setTimeout(() => {

        active.style.transition = "none";
        active.style.transform = "translateX(100%)";

        [active, next] = [next, active];

    }, 400);

}, 5000);


const assistant = document.getElementById("assistant");

// apparition 5 secondes après le chargement
window.addEventListener("load", () => {

    setTimeout(() => {

        assistant.classList.add("show");

    }, 3000);

});


    </script>
